name: deepharness

services:
  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: deepharness
      POSTGRES_USER: deepharness
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deepharness-local-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deepharness -d deepharness"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks: [control]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    init: true
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      target: gateway
    environment:
      PORT: "8080"
      # Local/test Compose keeps the auth boundary explicit without forcing
      # credentials into the repository. Production operators set AUTH_ENABLED=1
      # together with ADMIN_PASSWORD in their private environment.
      AUTH_ENABLED: ${AUTH_ENABLED:-0}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-0}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      DATABASE_URL: postgres://deepharness:${POSTGRES_PASSWORD:-deepharness-local-only}@postgres:5432/deepharness
      WORKER_SHARED_TOKEN: ${WORKER_SHARED_TOKEN:-phase-1-local-token}
      WORKSPACE_ROOTS: /workspace/source,/workspace/non-git
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:8080/health/ready');process.exit(r.ok?0:1)"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks: [control]
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    init: true
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      target: worker
    environment:
      PORT: "8081"
      GATEWAY_URL: http://gateway:8080
      WORKER_SHARED_TOKEN: ${WORKER_SHARED_TOKEN:-phase-1-local-token}
      WORKER_ID: phase-1-worker
      WORKSPACE_PATH: /workspace/source
      WORKSPACE_ROOTS: /workspace/source,/workspace/non-git
      WORKTREE_RUNS_ROOT: /workspace/runs
      WORKER_MAX_CONCURRENCY: ${WORKER_MAX_CONCURRENCY:-2}
      AGENT_IDLE_TTL_MS: ${AGENT_IDLE_TTL_MS:-900000}
      AGENT_PROMPT_TIMEOUT_MS: ${AGENT_PROMPT_TIMEOUT_MS:-600000}
      AGENT_SHUTDOWN_GRACE_MS: ${AGENT_SHUTDOWN_GRACE_MS:-5000}
      VENDOR_COMMIT: 987e55034c38497e1081367fdbe2056a6603ebc7
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      CLAUDE_CODE_USE_BEDROCK: ${CLAUDE_CODE_USE_BEDROCK:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_BEARER_TOKEN_BEDROCK: ${AWS_BEARER_TOKEN_BEDROCK:-}
      ANTHROPIC_BEDROCK_BASE_URL: ${ANTHROPIC_BEDROCK_BASE_URL:-}
      CLAUDE_CODE_USE_VERTEX: ${CLAUDE_CODE_USE_VERTEX:-}
      ANTHROPIC_VERTEX_PROJECT_ID: ${ANTHROPIC_VERTEX_PROJECT_ID:-}
      CLOUD_ML_REGION: ${CLOUD_ML_REGION:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      CLAUDE_CODE_USE_FOUNDRY: ${CLAUDE_CODE_USE_FOUNDRY:-}
      ANTHROPIC_FOUNDRY_RESOURCE: ${ANTHROPIC_FOUNDRY_RESOURCE:-}
      ANTHROPIC_FOUNDRY_BASE_URL: ${ANTHROPIC_FOUNDRY_BASE_URL:-}
      ANTHROPIC_FOUNDRY_API_KEY: ${ANTHROPIC_FOUNDRY_API_KEY:-}
      CLAUDE_CODE_USE_OPENAI: ${CLAUDE_CODE_USE_OPENAI:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      CLAUDE_CODE_USE_GEMINI: ${CLAUDE_CODE_USE_GEMINI:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      CLAUDE_CODE_USE_GROK: ${CLAUDE_CODE_USE_GROK:-}
      GROK_API_KEY: ${GROK_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      GROK_BASE_URL: ${GROK_BASE_URL:-}
      GROK_MODEL: ${GROK_MODEL:-}
      PERMISSION_REQUEST_TIMEOUT_MS: ${PERMISSION_REQUEST_TIMEOUT_MS:-120000}
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:8081/health/ready');process.exit(r.ok?0:1)"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [control]
    volumes:
      - ${HOST_WORKSPACE_PATH:-.}:/workspace/source
      - agent-state:/home/agent
      - agent-runs:/workspace/runs
      - non-git-workspaces:/workspace/non-git
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    mem_limit: ${WORKER_MEMORY_LIMIT:-2g}
    cpus: ${WORKER_CPU_LIMIT:-2.0}
    pids_limit: 256
    init: true
    stop_grace_period: 10s
    restart: unless-stopped

  test-model:
    profiles: [test, audit]
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      target: test-model
    environment:
      PORT: "8090"
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:8090/healthz');process.exit(r.ok?0:1)"]
      interval: 1s
      timeout: 2s
      retries: 20
    networks: [control]
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    init: true

  capability-audit:
    profiles: [audit]
    build:
      context: .
      dockerfile: docker/vendor-audit.Dockerfile
      target: audit
    environment:
      NODE_ENV: production
      USER_TYPE: external
    networks: [control]
    volumes:
      - ./artifacts/capabilities:/workspace/artifacts/capabilities
    command:
      - bun
      - run
      - packages/vendor-capabilities/src/cli.ts
      - audit
      - --previous
      - artifacts/capabilities/vendor-capability-manifest.json
      - --artifacts
      - /tmp/deepharness-capability-audit
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop: [ALL]
    init: true

  e2e:
    profiles: [e2e]
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      target: e2e
    environment:
      TEST_BASE_URL: http://gateway:8080
      WORKER_TEST_URL: http://worker:8081
      WORKER_SHARED_TOKEN: ${WORKER_SHARED_TOKEN:-phase-1-local-token}
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium
    depends_on:
      gateway:
        condition: service_healthy
      worker:
        condition: service_healthy
    networks: [control]
    volumes:
      - ./output/playwright:/app/output/playwright
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /home/node:size=128m,mode=1777
    cap_drop: [ALL]
    init: true

networks:
  control:
    driver: bridge

volumes:
  postgres-data:
  agent-state:
  agent-runs:
  non-git-workspaces:
